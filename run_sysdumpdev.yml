---
- name: Configure dump settings
  hosts: all
  gather_facts: false
  become: true
  remote_user: ost

  tasks:
   - name: just a test
     ansible.builtin.shell:
       cmd: sleep 1
     register: out
     tags: tt

   - name: print before output
     ansible.builtin.debug:
       var: out
     tags: tt

   - name: configure sysdump
     sysdumpdev:
       state: present
       #nx_gzip: True
       #secondary: /dev/dump1
       #permanent: true
       #copy_directory: /var/adm/ras
       #forced_copy_flag: True
       #dump_type: traditional
       dump_type: fw-assisted
       #dump_mode: allow_kernel
       #dump_mode: disallow
     register: dout
     tags: dump

   - name: print after output
     ansible.builtin.debug:
       var: dout
     tags: dump
#copy_directory=/var/adm/ras forced_copy_flag=False dump_type=fw-assisted dump_mode=disallow'

...
